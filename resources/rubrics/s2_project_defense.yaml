# S2 project defense with skeptical follow-up: rubric v0.1, DRAFT for the supervisor's review
# (ADR 0022, proposed). A 90-second project explanation, then 2 follow-up questions (FINAL_01 §3).
#
# Licence: CC BY-NC-SA 4.0. Adapted from the Oral Communication VALUE Rubric (AAC&U). This file
# is a derivative: its first five dimensions and the four-level scale follow the VALUE rubric and
# reuse the S1 wording reviewed by the supervisor (ADR 0017), with counts scaled to 90 s. The
# sixth dimension, follow-up handling, is not part of the VALUE rubric (FINAL_05 §1). The anchor
# wording is our own, rewritten as observable behaviour with numbers; no VALUE sentence is copied.
#
# How a level is reached: every condition of the level must hold; the dimension's level is the
# highest level reached; level 1 is the default. A measure that cannot be computed (camera off,
# no session limit, Arabic content) is left out of the conditions, never counted against the
# speaker. If no measure of a dimension can be computed, the dimension is "not measurable".
#
# Threshold values: configs/rubric.yaml, all provisional: re-estimate after E5/E6 (ADR 0022).
# The 90 s counts are scaled from S1 by ratio (about 90/150), not derived from data.

id: s2_project_defense
version: "0.1"
status: draft
licence: CC BY-NC-SA 4.0
attribution: >-
  Adapted from the Oral Communication VALUE Rubric, Association of American Colleges and
  Universities (AAC&U), CC BY-NC-SA 4.0. Changes: anchors rewritten as observable behaviour with
  provisional numbers; parts that no rule can observe are listed as left out.
