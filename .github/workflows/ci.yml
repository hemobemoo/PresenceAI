name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Tests (fast)
        run: uv run pytest -m "not slow and not needs_models and not needs_network and not needs_browser"

      - name: Licence check
        run: uv run python scripts/check_licenses.py
