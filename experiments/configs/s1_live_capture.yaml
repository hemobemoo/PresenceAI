# Spike S1 (live capture) measurement settings. Pass thresholds are NOT here: they are read
# from configs/live.yaml (video.min_fps, latency_budget_ms). Rule recorded in docs/adr/0002.

warmup_s: 5                # first seconds of each transport run, excluded from statistics
min_share_fps_ok: 0.95     # PASS needs processed fps >= min_fps in this share of post-warm-up seconds
meter_interval_ms: 100     # how often the server publishes a meter value
process_every: 1           # process every Nth received video frame (stand-in for landmarks)
process_size: [640, 360]   # frames are downscaled to this before processing (FINAL_02 §3.1)
echo_size: [160, 90]       # FastRTC send-receive return frame, kept small to limit load
fallback_stream_every_s: 0.1
time_limit_s: 600
track_constraints:
  width: 640
  height: 360
  frameRate: 30

# Landmark follow-up (ADR 0002). With --landmarks other than none, each transport submits
# every Nth received frame to the landmark worker (FINAL_02 §3.1: "process every 2nd-3rd
# frame"). FastRTC delivers ~30 fps; 2 gives ~15 fps, chosen by the owner on 2026-11-13 for
# fps margin (ADR 0002). The fallback delivers ~10 fps, so 1.
landmark_process_every:
  fastrtc: 2
  fallback: 1
# FastRTC sender parameters. maintain-resolution addresses the pixelation seen in the first
# real run: the browser drops frame rate instead of resolution when bandwidth is short.
rtp_params:
  degradationPreference: maintain-resolution
