# Spike S2 (ZeroGPU Space). Question and pass condition from
# docs/plan/FINAL_12_ROADMAP_AND_THESIS.md §1; the pass rule below is fixed in
# docs/adr/0007-zerogpu-space-spike.md before the run (owner, 2026-11-14).

model:
  source: openai/whisper-large-v3-turbo        # MIT; converted once by us (not at Space start)
  source_revision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9
  ct2_quantization: float16                    # stored weights
  converted_with: {ctranslate2: "4.9.0", transformers: "4.57.6"}
  # The private model repo id is a Space variable (S2_MODEL_REPO), not stored here.
  repo_revision: 7f416daaa0f1dba91ed5a76dcec1cb5a4dd1710c   # private model repo commit (2026-11-14)
  turbo_subfolder: large-v3-turbo-ct2-f16
  cpu_subfolder: small-ct2-int8                # S3 run 20261114-c3 base export (whisper-small)

space:
  gpu_compute_type: float16
  cpu_compute_type: int8
  gpu_duration_s: 60                           # @spaces.GPU(duration=...) reservation
  python_version: "3.12"
  gradio_sdk_version: 5.23.1                   # same as the project
  requirements:                                # torch for CUDA 12: CTranslate2 4.x needs cuBLAS 12 + cuDNN 9
    - torch==2.9.1
    - ctranslate2==4.9.0
    - faster-whisper==1.2.1
    - av>=19.0.2
    - numpy
    - huggingface_hub
    - spaces

transcribe:                                    # same decoding options as S3's laptop check
  language: en
  beam_size: 5
  temperature: 0.0
  condition_on_previous_text: false
  vad_filter: false

clip:
  dataset: amaai-lab/DisfluencySpeech          # public, Apache-2.0
  revision: b7da294fe3a70dd96df6640893f2a5dfc2c87638
  file: data/test-00000-of-00001.parquet
  text_column: transcript_a
  seed: 3407
  min_seconds: 180.0                           # whole clips joined until at least 3 minutes
  probe_seconds: 10.0                          # short clip for the GPU probe

runs:
  cold: 1
  warm: 3

# Pass rule (ADR 0007). All must hold.
pass:
  max_median_warm_gpu_s: 60.0                  # median of the warm calls, strictly below
  max_any_call_gpu_s: 60.0                     # no call over the reservation
