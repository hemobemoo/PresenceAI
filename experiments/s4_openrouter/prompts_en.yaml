    transcript: >
      Inflation means that prices in general are rising, so each unit of money buys less. Central
      banks usually aim for about two percent a year. When inflation is too high, they raise
      interest rates. Borrowing becomes more expensive, people and firms spend less, and price
      growth slows. The risk is that if rates rise too fast, the economy can fall into a recession.

  - id: en28
