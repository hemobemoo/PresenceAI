lang: en
prompts:
  - id: en01
    topic: final-year project defence opening
    duration_s: 48
    long_pauses: 1
    names: [Lina Haddad]
    transcript: >
      Good morning, my name is Lina Haddad and today I will present our final year project. Um, the
      project is a mobile app that helps students find study rooms on campus. We surveyed one
      hundred and twenty students and most of them said they waste time looking for a free room.
      So, uh, our app shows live room availability using the booking system. In this talk I will
      cover the problem, the design, and the results of our pilot.

  - id: en02
    topic: product pitch
    duration_s: 40
    long_pauses: 0
    transcript: >
      Imagine you could cut your grocery bill by a fifth without changing what you eat. That is
      what FreshTrack does. It reads your receipts, tracks what you throw away, and suggests
      smaller purchases next week. Our beta users saved an average of eighteen percent in their
      first month. We are asking for your support to launch in three more cities next spring.

  - id: en03
    topic: research findings summary
    duration_s: 62
    long_pauses: 3
    transcript: >
      So, um, our study looked at sleep and exam performance. We, uh, we collected data from
      sixty students over one semester. Um, students who slept less than six hours before an exam
      scored lower on average. But, you know, the effect was small and there were many other
      factors. Uh, we did not control for caffeine use, which is a limitation. Um, in future work
      we want to, uh, repeat the study with a larger sample and maybe use sleep trackers.

