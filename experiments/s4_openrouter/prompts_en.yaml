  - id: en06
    topic: history class presentation
    duration_s: 70
    long_pauses: 1
    transcript: >
      The printing press changed how ideas moved across Europe. Before it, books were copied by
      hand and were very expensive. After Gutenberg's press, the cost of a book fell sharply and
      the number of books grew quickly. This helped spread new religious and scientific ideas. It
      also helped standardise languages, because printers chose one spelling and used it in
      thousands of copies. Today we see a similar change with the internet.

  - id: en07
    topic: job interview self introduction
    duration_s: 45
    long_pauses: 2
    names: [Rami Saleh]
    transcript: >
      Uh, hello, I'm Rami Saleh. I studied computer engineering and, um, I graduated last June.
      During my internship I, uh, built a dashboard for monitoring server health. It reduced the
      time to find outages from about an hour to ten minutes. Um, I enjoy solving problems with
      data and, you know, I would like to grow as a backend developer in your team.

  - id: en08
    topic: science explainer
    duration_s: 58
    long_pauses: 0
    transcript: >
      Why is the sky blue? Sunlight contains all colours. When it enters the atmosphere, it hits
      tiny gas molecules. Short wavelengths, like blue, are scattered much more than long
      wavelengths, like red. So when you look at the sky away from the sun, you see this scattered
      blue light coming from every direction. At sunset, light travels through more air, the blue
      is scattered away, and the reds and oranges remain.

  - id: en09
    topic: thesis method section
    duration_s: 66
    long_pauses: 4
    transcript: >
      For the method, um, we used a, uh, a convolutional neural network. Um, the input is a
      spectrogram of two seconds of audio. Uh, we trained it on, um, about four thousand labelled
      clips. Uh, we used five fold cross validation. Um, and, uh, the metric is macro F1 because
      the classes are, um, not balanced. Uh, I will show the results on the next slide.

