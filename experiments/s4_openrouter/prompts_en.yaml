      The patient is a fifty five year old man who presented with chest pain for two hours. Um,
      the pain was central and spread to the left arm. Uh, his blood pressure was high and his
      heart rate was one hundred and ten. The ECG showed changes in the inferior leads. Um, we
      started treatment for a suspected heart attack and, uh, referred him for an angiogram.

  - id: en16
    topic: book review
    duration_s: 52
    long_pauses: 1
    transcript: >
      The book I chose is about how habits form. The author argues that small changes, repeated
      every day, add up to large results. What I liked most is the idea of making good habits easy
      and bad habits hard. What I liked less is that many examples are from sports and business,
      so they may not fit everyone. Overall I would recommend it to first year students.

