      Plastic bags take hundreds of years to break down. In our city alone we use about one
      million of them every month. Um, many end up in the river. Last year volunteers removed three
      tonnes of rubbish from the river banks. We are proposing a small fee on plastic bags at
      supermarkets. Cities that did this saw bag use fall by more than half within a year.

  - id: en15
    topic: medical student case presentation
