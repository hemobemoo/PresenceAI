lang: ar
prompts:
  - id: ar01
    topic: افتتاح مناقشة مشروع التخرج
    duration_s: 50
    long_pauses: 1
    names: [ليلى حداد]
    transcript: >
      صباح الخير، اسمي ليلى حداد وسأعرض اليوم مشروع التخرج. يعني المشروع تطبيق يساعد الطلاب على
      إيجاد قاعات الدراسة الفارغة في الحرم الجامعي. أجرينا استبيانًا شمل مئة وعشرين طالبًا، وقال
      أغلبهم إنهم يضيعون وقتًا طويلًا في البحث عن قاعة. امم لذلك يعرض تطبيقنا حالة القاعات مباشرة
      من نظام الحجز. سأتحدث عن المشكلة ثم التصميم ثم نتائج التجربة الأولية.

  - id: ar02
    topic: عرض منتج
    duration_s: 42
    long_pauses: 0
    transcript: >
      تخيلوا أنكم تستطيعون خفض فاتورة البقالة بمقدار الخمس دون تغيير ما تأكلونه. هذا ما يفعله
      تطبيق فريش تراك. يقرأ الإيصالات ويتابع ما يُرمى من طعام ويقترح مشتريات أصغر في الأسبوع
      التالي. وفّر مستخدمو النسخة التجريبية ثمانية عشر بالمئة في الشهر الأول. نطلب دعمكم لإطلاق
      التطبيق في ثلاث مدن أخرى.

  - id: ar03
    topic: ملخص نتائج بحث
    duration_s: 64
    long_pauses: 3
    transcript: >
      يعني دراستنا تناولت العلاقة بين النوم ونتائج الامتحانات. امم جمعنا بيانات من ستين طالبًا
      خلال فصل دراسي واحد. يعني الطلاب الذين ناموا أقل من ست ساعات قبل الامتحان حصلوا على درجات
      أقل في المتوسط. لكن الأثر كان صغيرًا، وكانت هناك عوامل أخرى كثيرة. امم لم نضبط استهلاك
      القهوة، وهذا من حدود الدراسة. يعني نريد مستقبلًا تكرار الدراسة بعينة أكبر.

  - id: ar04
    topic: تحديث حالة فريق العمل
    duration_s: 55
    long_pauses: 2
    names: [عمر خليل, سارة]
    transcript: >
      أنهى فريق الخوادم هذا الأسبوع خدمة تسجيل الدخول. أصلح عمر خليل خطأ استعادة كلمة المرور،
      وكتبت سارة الاختبارات لوحدة الدفع. امم نحن متأخرون في صفحة التقارير لأن التصميم تغيّر
      مرتين. يعني خطتنا أن ننهيها يوم الثلاثاء. الخطر الأكبر هو نقل قاعدة البيانات، لأننا لم
      نختبره على بيانات حقيقية حتى الآن.

  - id: ar05
    topic: ختام مناقشة رسالة
    duration_s: 52
    long_pauses: 1
    transcript: >
      في الختام، أظهرت هذه الرسالة أن نموذجًا صغيرًا مدرَّبًا على بيانات محلية يمكن أن يضاهي
      نموذجًا عامًا كبيرًا في مهمتنا، مع تشغيله على حاسوب محمول. أهم حدود العمل حجم مجموعة
      الاختبار، إذ لم تتجاوز ثلاثمئة عينة. امم في العمل المستقبلي سنجمع بيانات من مناطق أخرى.
      شكرًا لكم، ويسعدني أن أجيب عن أسئلتكم.
