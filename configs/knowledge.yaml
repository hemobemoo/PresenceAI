# Knowledge base from open public-speaking textbooks (P2-d, ADR 0020; FINAL_07 §F).
# Built by scripts/build_knowledge_base.py from the EPUBs in data/texts/raw/ (git-ignored).
# Every chunk keeps book, chapter, section and licence; NC-SA chunks are never T2 training text.

chunk_max_tokens: 400          # FINAL_07 §F: "chunk ~400 tokens" (e5 tokenizer, passage prefix included)
top_k: 5                       # chunks returned per question
spine_prefixes: [chapter]      # Pressbooks: only chapter files; covers, front and back matter skipped

