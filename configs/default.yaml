# PresenceAI defaults, read by src/presenceai/settings.py.
# Values marked "ADR pending" come from the plan and still need an ADR in docs/adr/.
# null = a human decision is pending (AGENTS.md rule 7). Secrets never go in this file.

runtime: local        # local | space | offline (configs/runtime/, FINAL_02 §6)
profile: standard     # lite | standard | space (configs/profiles/, FINAL_03 §9) — ADR pending
language: en          # en | ar (FINAL_04 §5)

features:
  camera_enabled: true          # vision is optional; camera-off is fully supported (FINAL_04 §4)
  live_prompts_enabled: true    # users can turn prompts off (FINAL_05 §6)
  ai_wording_enabled: false     # OpenRouter used only when the user enables it (AGENTS.md rule 2)
  keep_raw_media: false         # consent switch (c), FINAL_11 §3

retention:
  raw_media_days: 30            # source: FINAL_11 §3 — ADR pending
  study_media_max_days: 60      # not applicable: no human-participant study (ADR 0010); unused

expressions:                    # FINAL_04 §4.3 — thresholds set from calibration data
  baseline_delta: null          # TODO(ADR): δ above the user's neutral baseline
  min_duration_s: null          # TODO(ADR): plan suggests ≥ 0.5 s
  eyes_closed_min_s: null       # TODO(ADR): plan suggests ≥ 0.4 s

asr:                            # FINAL_04 §2, FINAL_06 §1; decoding options as in S2/S3 (ADR 0005, 0007)
  model: whisper_small          # whisper_small | whisper_turbo (keys under `asr:` in models.yaml)
  device: cpu                   # cpu | cuda | auto
  compute_type: int8            # CTranslate2 compute type on the laptop
  beam_size: 5
  temperature: 0.0
  condition_on_previous_text: false

speech:                         # ADR 0011 (P1 slice 2: pauses and rate); FINAL_04 §2, §6
  vad:                          # Silero VAD bundled with faster-whisper (MIT); tuned only on C1 dev
    threshold: 0.5              # Silero default
    min_speech_duration_ms: 250 # Silero default; owner 2026-11-17 (100 only if C1 dev shows better)
    min_silence_duration_ms: 100  # below the smallest pause threshold, so 0.25 s pauses survive
    speech_pad_ms: 0            # padding would shorten every pause by 2 x pad
  pauses:
    thresholds_s: [0.25, 1.0, 2.0]          # FINAL_04 §2
    sentence_marks: [".", "!", "?", "؟", "…"] # pause after these = sentence_boundary
    clause_marks: [",", "،", ";", "؛"]       # pause after these = clause_boundary (reported, not penalised)
    max_words_per_sentence_mark: 30          # fewer marks than 1 per 30 words -> position unknown, low
  rate:
    window_s: 10.0              # FINAL_04 §2 sliding windows
    hop_s: 5.0
    min_speaking_time_s: 10.0   # below this, rate and pace are "not measurable"
  syllables:                    # own implementation of de Jong & Wempe (2009); values from their v2 script (2010)
    window_ms: 64               # intensity window (Praat, pitch floor 50 Hz: 3.2 / 50 s)
    hop_ms: 16                  # Praat default time step at 50 Hz (0.8 / 50 s)
    reference_quantile: 0.99    # "almost maximum" intensity
    silence_threshold_db: -25.0 # peaks below reference + this are ignored
    min_dip_db: 2.0             # a peak must rise this much above the preceding dip
  confidence:                   # FINAL_04 §6 bands
    high: {min_word_probability: 0.85, min_speaking_time_s: 30.0}
    medium: {min_word_probability: 0.70, min_speaking_time_s: 10.0}
  pitch:                        # ADR 0012: pYIN (librosa), run once per recording; reused in slice 4
    fmin_hz: 65.0               # limited range keeps pYIN fast (~5 s per 3 min on the laptop)
    fmax_hz: 400.0
    frame_length: 1024          # 64 ms at 16 kHz (>= 4 periods at 65 Hz)
    hop_length: 160             # 10 ms
  fillers:                      # ADR 0012
    # Base Whisper drops fillers: counts are lower bounds and confidence is capped until a
    # verbatim model (T1, `verbatim: true` in models.yaml) is used.
    confidence_cap_without_verbatim: {en: medium, ar: low}
    acoustic:                   # PROVISIONAL: tune only on DisfluencySpeech non-test + AMI dev sessions
      min_duration_s: 0.15
      min_voiced_fraction: 0.7
      max_pitch_sd_semitones: 1.0
      max_unvoiced_gap_s: 0.05  # unvoiced dropouts merged inside one candidate
      agreement_tolerance_s: 0.05  # candidate within this of a lexicon filler = both agree
  repetitions:                  # FINAL_04 §2
    max_ngram: 3
    window_s: 2.0               # second copy starts within this many seconds of the first's end
