# Model ids and digests (FINAL_06 §1). Downloads happen only in scripts/download_models.py.
# digest: null until the file is downloaded and recorded in models/MANIFEST.json.

asr:
  # Fetched from huggingface.co at a pinned commit and converted to CTranslate2 by
  # scripts/download_models.py (owner approval 2026-11-17). Every source file is checked against
  # the hash Hugging Face lists for that commit; SHA-256 of every source and converted file goes
  # to models/MANIFEST.json. `dir` is the folder under models/ that speech/asr.py loads.
  whisper_small:
    backend: faster-whisper
    licence: MIT
    verbatim: false                        # drops fillers; filler/repetition counts are lower bounds
    source: {repo: openai/whisper-small, revision: 973afd24965f72e36ca33b3055d56a652f456b4d}
    quantization: int8                     # as the S3 base export (ADR 0005)
    dir: whisper-small-ct2-int8
  whisper_turbo:
    backend: faster-whisper
    licence: MIT
    verbatim: false
    source: {repo: openai/whisper-large-v3-turbo, revision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9}
    quantization: float16                  # same revision and settings as S2 (ADR 0007)
    dir: whisper-large-v3-turbo-ct2-f16
  t1_verbatim: {id: null, backend: faster-whisper, licence: null, digest: null, verbatim: true}   # TODO: after T1
vad:
  silero: {id: silero-vad, licence: MIT, digest: null}
vision:
  face_landmarker:
    url: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
    licence: Apache-2.0
    digest: 64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff   # SHA-256, pinned 2026-11-12
  pose_landmarker_full:
    url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
    licence: Apache-2.0
    digest: 4eaa5eb7a98365221087693fcc286334cf0858e2eb6e15b506aa4a7ecdcec4ad   # SHA-256, pinned 2026-11-12
  pose_landmarker_lite:   # FINAL_03 §9 lite profile; URL follows Google's documented "latest" pattern
    url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task
    licence: Apache-2.0
    digest: 59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a   # SHA-256, pinned 2026-11-12
  gaze_zone_t3: {id: null, licence: null, digest: null}   # TODO: after T3
embeddings:
  default: {id: unsloth/embeddinggemma-300m-GGUF, licence: Gemma Terms of Use, digest: null}
  open_alternative: {id: intfloat/multilingual-e5-small, licence: MIT, digest: null}
nlp:
  spacy_en: {id: en_core_web_sm, licence: MIT}
# Converter used for every `asr` entry; same versions as S2 (ADR 0007). Run with
# `uv run --no-project --with ...` so torch and transformers never become app dependencies.
converter:
  python: "3.12"
  packages: [ctranslate2==4.9.0, transformers==4.57.6, torch==2.15.0, numpy]   # torch: S2 left it unpinned; 2.15.0 is the CPU wheel it resolved (uv cache)
  source_files:   # Whisper files needed for conversion (PyTorch/TF/Flax duplicates are skipped)
    - config.json
    - generation_config.json
    - model.safetensors
    - added_tokens.json
    - merges.txt
    - normalizer.json
    - preprocessor_config.json
    - special_tokens_map.json
    - tokenizer.json
    - tokenizer_config.json
    - vocab.json
  copy_files: [tokenizer.json, preprocessor_config.json]
llm:
  openrouter:
    # ADR 0003 (proposed; owner's choice 2026-11-13): NVIDIA pinned + NVIDIA fallback, both
    # passed S4 run 20261113-143329. Last fallback = emergency fallback from another provider
    # (Recursive), passed re-run 20261113-211500. Chain: pinned -> fallbacks in order ->
    # coach_slm -> templates. Frozen during study weeks.
    pinned: nvidia/nemotron-3-ultra-550b-a55b:free
    fallbacks: [nvidia/nemotron-3.5-super-vl:free, recursive/flint-v1.0:free]
  coach_slm: {id: null, licence: null, digest: null}      # TODO: after T2
