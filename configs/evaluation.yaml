# Pass targets for experiments (FINAL_10 §1). Changed only with an ADR (AGENTS.md rule 7).

e2:                                  # ADR 0009 (accepted 2026-11-17); data: C1 synthetic speech
  wpm_error_pct_max: 5.0             # mean absolute % error across clips
  pause_f1_min:                      # F1 over all clips, pauses at least this long (seconds)
    "0.5": 0.90
    "1.0": 0.90
  duration_error_s_max: 0.10         # mean absolute error across clips
  report_per_clip: true              # every per-clip value is written next to the aggregate
  report_pause_position: true        # ADR 0014 §6: mid->boundary, boundary->mid (headline); ADR 0011 extras
  split:                             # ADR 0011: C1 split once, before any tuning (owner-confirmed)
    unit: script                     # all clips of one script fall in the same part
    dev_fraction: 0.3                # ~90 of ~300 clips; VAD and detector values are tuned here only
    seed: 20261117
    stratify_by: [rate_band, voice]  # counts checked for both; drawn by voice (ADR 0014 §5)
    print_counts: true               # per part, by rate band and voice; empty cell -> error
    tune_on: dev
    score_on: test                   # E2 pass/fail (targets above) uses the held-out test part only
  # ADR 0014 (owner, 2026-11-17), all fixed before the first E2 run:
  wpm_judged_on: all_clips           # filler / no-filler breakdown is extra information only
  match:                             # a detected pause matches a true pause (one-to-one,
    onset_tolerance_s: 0.20          # largest overlap first) if they overlap and their onsets
    require_overlap: true            # differ by at most this
  f1_exclusion_s: 0.10               # true pauses within +/- this of a threshold count neither
                                     # way in the target F1; F1 without exclusion is also reported
  min_pause_s: 0.25                  # true pauses and duration error use pauses >= this (ADR 0011)
  pipeline: [asr, vad, pauses, rate] # the app's own functions; pYIN is not needed for E2
  noise:                             # extra, descriptive condition: no pass target
    part: test
    snr_db: [20, 10]                 # speech power (true speech spans) over noise power
    color: pink
    seed: 20261117

b1:                                  # ADR 0016 amendment (owner, 2026-11-19); owner's own recordings
  labels:
    overlap_margin_s: 0.10           # PROVISIONAL. A Whisper word whose midpoint is inside a pause goes
                                     # to the side where more of it lies outside the pause, if that
                                     # part is longer by more than this; otherwise the label is "?"

c1:                                  # ADR 0014: synthetic English speech for E2 (FINAL_07 §C)
  seed: 7                            # FINAL_07: synth-speech --seed 7
  scripts: resources/c1/scripts.yaml # 60 scripts written for PresenceAI (DATA_SOURCES.md)
  generator:                         # runs on Colab only, in its own environment (ADR 0014 §1)
    model_id: hexgrad/Kokoro-82M     # Apache-2.0
    revision: f3ff3571791e39611d31c381e3a41a3af07b4987
    sample_rate: 24000
    files:                           # SHA-256 from the Hub's LFS metadata at this revision
      kokoro-v1_0.pth: 496dba118d1a58f5f3db2efc88dbdc216e0483fc89fe6e47ee1f2c53f18ad1e4
      voices/af_heart.pt: 0ab5709b8ffab19bfd849cd11d98f75b60af7733253ad0d67b12382a102cb4ff
      voices/af_bella.pt: 8cb64e02fcc8de0327a8e13817e49c76c945ecf0052ceac97d3081480e8e48d6
      voices/am_michael.pt: 9a443b79a4b22489a5b0ab7c651a0bcd1a30bef675c28333f06971abbd47bd37
      voices/am_fenrir.pt: 98e507eca1db08230ae3b6232d59c10aec9630022d19accac4f5d12fcec3c37a
      voices/bf_emma.pt: d0a423deabf4a52b4f49318c51742c54e21bb89bbbe9a12141e7758ddb5da701
      voices/bm_george.pt: f1bc812213dc59774769e5c80004b13eeb79bd78130b11b2d7f934542dab811b
    git_blob_sha1:                   # not an LFS file: checked by its git blob id
      config.json: 14a726edd3718279eac426630879ff743955b16a
    pip: ["kokoro==0.9.4", "misaki[en]==0.9.4", "soundfile"]  # Colab only, never in pyproject
    spacy_model:                     # misaki's tokenizer; official wheel, MIT
      url: https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      sha256: 1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85  # recorded on the first download (Colab run t1, 2026-11-17)
  voices:                            # 10 scripts each; misaki lang code a = American, b = British
    af_heart: a
    af_bella: a
    am_michael: a
    am_fenrir: a
    bf_emma: b
    bm_george: b
  scripts_per_voice: 10
  renders_per_script: 5
  target_wpm: [119, 137, 155, 173, 191]  # centres of five equal steps over 110-200 wpm
  accept_within_wpm: 9               # a render outside target +/- this is re-rendered
  max_rerenders: 2                   # then kept if inside wpm_range, else dropped and counted
  wpm_range: [110, 200]              # FINAL_10 §2
  rate_bands: [[110, 140], [140, 170], [170, 200]]  # split and reports use the MEASURED wpm
  clip_s: [35, 75]
  speed_range: [0.5, 2.0]            # Kokoro speed setting limits
  words_per_script: [105, 125]
  max_words_per_sentence_mark: 20    # well under ADR 0011's 30, so positions are never unknown
  gaps:                              # silence inserted between separately generated phrases
    short_s: [0.05, 0.20]            # not a pause (tests false alarms)
    pause_s: [0.30, 3.00]            # a true pause
    pause_distribution: log_uniform  # more short than long pauses
    pause_probability:               # chance that a boundary gets a pause instead of a short gap
      sentence_boundary: 0.6
      clause_boundary: 0.4
      mid_sentence: 0.5
  fillers:                           # counted in the true wpm; never used for E3 (ADR 0014)
    clip_share: 0.33
    per_clip: [1, 2]
    tokens: [um, uh]
    after_s: [0.05, 0.20]            # short gap after the filler
  edge_silence_s: 0.5               # silence before the first and after the last phrase
  noise_floor_dbfs: -60              # white noise over the whole clip, added after joining
  trim:                              # phrase edges on the clean Kokoro output (ADR 0014 §3)
    frame_ms: 5
    threshold_db_below_peak: 55      # a frame is speech if within 55 dB of the phrase's loudest frame
    internal_min_silence_s: 0.10     # Kokoro's own silences inside a phrase, reported
    internal_joins_truth_s: 0.25     # ... and added to the true pauses from this length
  timing_run_clips: 5                # first Colab run: time 5 clips before generating the rest

e3:                                  # ADR 0012; filler detection (FINAL_10 E3). Targets: none yet
  tuning:                            # acoustic filler values are tuned ONLY here, before E3 runs
    disfluencyspeech: [train, validation]   # Apache-2.0; its test split is used only for scoring
    ami_dev_sessions: [ES2005, IS1001, TS3005]  # all four meetings (a-d) of each session
  scoring:
    disfluencyspeech: [test]
    ami_test_sessions: [ES2002, ES2006, ES2008, IS1003, IS1009, TS3006, TS3007]
    podcastfillers: [test]           # research-only: evaluation, never tuning or training
  ami_split:                         # drawn once on 2026-11-17, before any AMI download or tuning
    unit: session                    # a session's 4 meetings share speakers, so they stay together
    stratify_by: site                # one dev session per site (ES, IS, TS)
    seed: 20261117                   # random.Random(seed).choice per site, sessions sorted
    pool: [ES2002, ES2005, ES2006, ES2008, IS1001, IS1003, IS1009, TS3005, TS3006, TS3007]  # disfluency layer
  conditions:                        # every detector is scored in each ASR condition
    - base                           # whisper_small / whisper_turbo as in the app (default)
    - base_initial_prompt            # extra condition, not the default: Whisper prompted with
                                     # filler-rich text (prompt fixed in the E3 config before E3)
    - t1                             # after T1 (P4)
  report: [precision, recall, f1]    # precision shows made-up fillers (e.g. from initial_prompt)
  # ---- ADR 0028 (proposed): the E3 protocol, fixed before the first E3 run (PR-3) ----
  model: whisper_small               # owner E6: T1's base; turbo report-only, never deciding
  model_text_files_lf_sha256:        # ADR 0028 §7: the converter's own JSON files, compared after
    # \r\n -> \n (the laptop is Windows and wrote CRLF; Colab writes LF). Taken from the laptop's
    # models/whisper-small-ct2-int8 with line endings normalised; equal to run b2's Colab output.
    # Every other converted file (model.bin, tokenizer.json, preprocessor_config.json) must
    # still match models/MANIFEST.json byte for byte.
    config.json: b55496ac7940a7ae47d2c01eab40edfd8701feec1229d9cce3b40014383fb828
    vocabulary.json: 5ad28279db5e546349708b9a74736e2c018737ac5a600f1048f1f26c99b85b47
  decoding:                          # owner 1: the app's settings (default.yaml asr), unchanged for
    compute_type: int8               # base, base_initial_prompt and every T1 run
    beam_size: 5
    temperature: 0.0
    condition_on_previous_text: false
    language: en
    word_timestamps: true
    vad_filter: false                # as speech/asr.py
  initial_prompt: "Umm, let me think, uh, like, hmm... Okay, so, um, here's what I was, uh, thinking."  # owner E4
  detector: lexicon                  # owner E5/6: T1's pass rule compares lexicon on base vs lexicon
                                     # on T1; acoustic and fusion wait until tuned on dev (ADR 0012 §4)
  wer_normaliser:                    # owner 2 (LibriSpeech): lower case, punctuation removed,
    lower_case: true                 # fillers NOT removed (an invented filler on read speech is
    remove_punctuation: true         # a real error); the same for base and T1
    remove_fillers: false
  ami:
    deciding_unit: t1_segments       # owner E3: the T1 per-speaker segments, 20 % crosstalk filter
    secondary_unit: t1_segments_crosstalk_kept   # reported, non-deciding (crosstalk_max_share 1.0)
  podcastfillers:
    scored_labels: [Uh, Um]          # fullvoc_label; the only fillers it labels as such
    hypothesis_family: [uh, um, uhm, er, erm]    # owner E2: hmm, mm, ah ignored on PodcastFillers
    match_tolerance_s: 0.2           # owner E2, PROVISIONAL: event widened by +/- 0.2 s, one-to-one
    precision_is_lower_bound: true   # its annotation may not cover every filler (ADR 0028)
  repetitions:
    reference: ami_disfluency_layer  # owner E7: probed first; only marked repetitions count
    measure: kept_in_transcript      # ADR 0028: a reference repetition is "kept" if every one of its
                                     # words is aligned to the same word in the hypothesis
  bootstrap:
    resamples: 1000
    seed: 20261128
    unit: {disfluencyspeech: clip, ami: meeting, podcastfillers: episode, librispeech: speaker}
  disfluencyspeech_text_check: first # ADR 0027 §6: step 0, pass = words_differ <= 50 of 5,000

t1:                                  # ADR 0027 (proposed): T1 data preparation (ADR 0026 §3)
  seed: 20261127                     # meeting order; the E11 draw uses the same date seed (ADR 0026)
  disfluencyspeech:
    repo: amaai-lab/DisfluencySpeech
    revision: b7da294fe3a70dd96df6640893f2a5dfc2c87638
    text_from: transcript_annotated  # owner P3: fillers AND partial words ("th-") kept; NOT
                                     # transcript_a (S3 / ADR 0005 used transcript_a)
    text_check_max_words_differ: 50  # owner 2026-11-27 (ADR 0027 §6): of 5,000 rows, at most 1 %; never moved
  ami:
    train_speech_hours: 10.0         # owner P1: speech KEPT in the manifest, after the crosstalk filter
    manifest_sha256: fd51f6614bbf8e13c40894ead6f754ac4cbb3fa851c6d9b9e76aeaa7e8a693a8  # run d3; T1-r2 checks it
    meeting_kind: scenario           # ES / IS / TS sessions only, so the three sites alternate
    sites: [ES, IS, TS]              # round-robin over sites, seeded shuffle within each site
    exclude_sessions_from: e3.ami_split.pool   # the ten disfluency-layer sessions never train
    exclude_shared_speakers: true    # nor any meeting with a speaker from those ten sessions
    segment:                         # per speaker headset, cut at that speaker's own pauses
      split_gap_s: 0.5               # PROVISIONAL: a new segment starts after a gap >= this
      max_s: 30.0                    # Whisper's window
      min_s: 1.0                     # PROVISIONAL: shorter segments are dropped
      pad_s: 0.1                     # PROVISIONAL: audio kept before the first / after the last word
      crosstalk_max_share: 0.20      # owner P4, PROVISIONAL: other speakers' words over > 20 % -> drop
      drop_if_gap_element: true      # PROVISIONAL: a transcriber <gap> inside -> drop the segment
    spelling:                        # AMI spelling -> E3 lexicon spelling (lang/en/fillers.yaml);
      um: um                         # lower-cased keys; the data run's format probe lists what AMI uses
      uh: uh
      uhm: um
      er: er
      erm: erm
      hmm: hmm
      mm: mm
      ah: ah
    backchannels: [mm-hmm, uh-huh, mm-mm, uh-uh]   # owner P2: kept as written, ZERO fillers, never
                                                   # split at the hyphen
  partial_marker: "-"                # a partial word keeps a trailing hyphen ("th-"); "um-" counts as "um"

public_data:                         # ADR 0026 §1 / DATA_SOURCES §1-4; fetched on Colab only
  podcastfillers:                    # owner D1/E1/E8: evaluation only; research-only annotations
    record: https://zenodo.org/records/7121457
    files_api: https://zenodo.org/api/records/7121457/files/{key}/content
    parts:                           # split zip: .z01 .z02 .z03 then .zip (disks 0-3); md5 = Zenodo's
      - {key: PodcastFillers.z01, bytes: 6442450944, md5: e0941abae2a9e5bbe0e7c28f6140ccc7}
      - {key: PodcastFillers.z02, bytes: 6442450944, md5: 25a149c5dc76fa7c91d0edb6e77aedb6}
      - {key: PodcastFillers.z03, bytes: 6442450944, md5: 399c44abb9ec35aa56d6fbf75043164b}
      - {key: PodcastFillers.zip, bytes: 5915177141, md5: 20e9f6b93b1b5c2e1c9d8b774ca28c33}
    annotations_csv: {key: PodcastFillers.csv, bytes: 21698037, md5: 68d8614ad562263c621b90dc81f06abd}
    access: range_requests           # owner E1: only the test WAVs; fallback: all four parts
    test_wav_dir: audio/episode_wav/test/
    licence_members: [LICENSE_ANNOTATIONS_ADOBE_RESEARCH_LICENSE.txt, LICENSE_AUDIO.csv]  # read first
    test_wav_sha256_file: null       # per WAV, checked against its CRC32, pinned after the first run
  ami_annotations:
    url: https://groups.inf.ed.ac.uk/ami/AMICorpusAnnotations/ami_public_manual_1.6.2.zip
    sha256: b56e5babb2496b8795deeeda7e71178d7fbc9963f94276cf2a3f4b56ebbc9f9d  # run d2, 22,887,865 bytes
    licence_must_state: CC BY 4.0    # read FIRST; stop before any other AMI file otherwise
  ami_headset:
    url: https://groups.inf.ed.ac.uk/ami/AMICorpusMirror/amicorpus/{meeting}/audio/{meeting}.Headset-{channel}.wav
    sha256_file: configs/pins/ami_headsets.json   # 140 files, run d3 (ADR 0027 §6); loaded into sha256
  librispeech_test_clean:
    url: https://www.openslr.org/resources/12/test-clean.tar.gz
    sha256: 39fde525e59672dc6d1551919b1478f724438a95aa55f874b576be21967e6c23  # run d3, 346,663,984 bytes
    licence: CC BY 4.0               # OpenSLR 12 page, checked 2026-11-27
