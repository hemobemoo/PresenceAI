about:
  heading: "About PresenceAI"
  body: |
    PresenceAI measures what can be observed in a practice talk: speech rate, pauses, fillers,
    loudness and pitch variation, and how the content is organised. Every statement shows its
    evidence (a quote or a time) and a confidence.

    It describes only what was measured in the recording, never the person: it makes no
    guess about what anyone feels or is like, and it is not a hiring or grading tool.

    **Why a part of the report can say "not measurable"**

    - **Camera off:** gaze is measured only with the camera on. Measures that need the camera
      are left out of the count when it is off, so camera off is never penalised.
    - **No time limit:** an uploaded file has no session time limit, so time over the limit
      cannot be measured.
    - **Arabic:** content measures (main message, organisation, language, supporting material)
      and mid-sentence pauses are measured in English only for now.
    - **Punctuation:** when the transcript has too few sentence marks, pause positions cannot
      be told.
    - **A check failed:** if one part of the report cannot be checked, it is shown as not
      measurable and the rest of the report still appears.

    Each part says "based on N of M measures". When half or fewer of its measures could be
    computed, its level is limited to 3.

    **Your data:** recordings and report text are encrypted on this computer with your key
    (MEDIA_KEY). Without that key they cannot be read; levels and measures stay available for
    your progress. You can export or delete everything on the "My data" tab.
