# Speech report texts (ADR 0016). Speech code uses these keys only, never its own wording.
# Placeholders are Python format fields, e.g. {snr:.0f}; lang/ar/report.yaml must have the same
# keys and the same placeholder names. Fragments that start with "; " or " (" are appended to a
# method text. Wording rule (AGENTS.md): observable behaviour + number + location, no verdicts.
common:
  no_speech: "no speech detected"
  no_speech_recording: "no speech detected in this recording"
  no_words: "no recognised words"
  no_voiced: "no voiced speech"
  too_little_speech: "only {speech_s:.1f} s of speech; at least {minimum:g} s needed"
  too_little_speech_whole: "only {speech_s:.0f} s of speech; at least {minimum:g} s needed"
  too_noisy: "not measurable in this recording: too noisy ({snr:.0f} dB signal-to-noise)"
  noisy_note: "; noisy recording ({snr:.0f} dB signal-to-noise)"
timing:
  overrun: "seconds from the {limit:g} s time limit to the end of the last speech"
  no_limit_upload: "uploaded file: no time limit"
storage:
  text_unavailable: "Report text unavailable: it could not be decrypted with MEDIA_KEY (a different or lost key). Levels and measures are still shown."
pauses:
  count_ge: "VAD gaps >= {threshold} s"
  by_position: "VAD gaps by position: {position}"
  mean: "mean pause"
  p90: "90th percentile pause"
  longest: "longest pause"
  no_pauses: "no pauses of at least {shortest} s"
  mid_per_min: "mid-sentence pauses of at least {minimum:g} s per minute of speaking time (first to last speech)"
  mid_per_min_language: "not measurable: pause positions are not available for this language"
  mid_per_min_punctuation: "not measurable: the transcript has too few sentence marks to place pauses in sentences"
positions:
  sentence_boundary: "sentence_boundary"
  clause_boundary: "clause_boundary"
  mid_sentence: "mid_sentence"
  unknown: "unknown"
rate:
  wpm: "words / speaking time (first to last speech)"
  articulation_wpm: "words / time inside VAD speech regions"
  syllables: "syllable nuclei (intensity peaks, de Jong & Wempe 2009) / speech time"
  syllables_info_only: "; information only (values validated on Dutch speech)"
fillers:
  lower_bound: " (lower bound: the base model drops fillers)"
  markers_upper_bound: " (upper bound: every occurrence counted, including ordinary uses; information only)"
  count: "lexicon hesitations"
  per_100: "lexicon hesitations / non-filler words"
  per_100_upper: "upper end of the range: lexicon + acoustic candidates without a lexicon filler (provisional detector)"
  per_100_at_least: "at least {rate:.1f} per 100 words: lexicon hesitations / non-filler words{bound}; the true rate can be much higher"
  acoustic_only: "extra candidates, not counted as fillers: voiced, steady-pitch sound with no word and no lexicon filler nearby (provisional detector)"
  acoustic: "voiced, steady-pitch sound with no word (provisional detector)"
  markers_count: "lexicon discourse markers"
  markers_per_100: "lexicon discourse markers / non-filler words"
repetitions:
  lower_bound: " (lower bound: the base model drops repetitions)"
  method: "repeated 1-{max_ngram}-word phrases within {window_s:g} s"
  per_100_suffix: " / non-filler words"
loudness:
  noise_unknown: "; noise level unknown (too little non-speech)"
  processing: "; browser auto-gain or noise processing was on or unknown, which flattens loudness"
  variation_cv: "coefficient of variation of 1 s speech-window loudness (relative)"
  spread_db: "loud minus quiet speech (p90 - p10 of 1 s windows); information only"
  clipping: "samples at or above {level:g} of full scale in runs of >= {run}, on the original samples"
  possible_clipping: "possible clipping: a plateau just under the file's peak (within {band:.0%}, at least {ratio:g} times the band below), typical of a clipped file after lossy compression; provisional rule, on the original samples"
  baseline_no_level: "the baseline has no speech level"
  baseline: "typical speech level compared with your own baseline recording"
  baseline_device_note: "; a change of microphone or distance cannot be detected"
  baseline_processing: "; browser processing in the baseline was on or unknown"
pitch:
  too_little_voiced: "only {voiced_s:.1f} s of usable voiced speech; at least {minimum:g} s needed"
  low_voiced: "; only {voiced_s:.0f} s of usable voiced speech"
  noise_unknown: "; noise level unknown"
  octave: "; {corrected} of {usable} frames corrected for octave errors"
  at_limit: "; {share:.0%} of frames at the pitch range limit"
  base: "semitones from your own typical pitch, voiced speech without fillers, octave errors corrected; information only"
  sd: "spread (SD) of {base}"
  range: "range (p90 - p10) of {base}"
language_check:
  # A notice only: the analysis always runs in the chosen language and no score changes.
  notice: "The language detected in the first {window_s:g} s of speech is {detected} (probability {probability:.0%}), not {chosen}, which you chose. The analysis used {chosen}; if that is wrong, choose the right language and analyse again."
language_names:
  en: "English"
  ar: "Arabic"
  other: "another language (code {code})"
text:
  not_measured_language: "content measures cover English only (FINAL_04 §5); this recording is in {language}"
  unreliable_punctuation: "not measurable: the transcript has too few sentence marks to count sentence length"
  central_message:
    possible_main_point: "the first sentence within the first {share:g} % of the words that is not a question and contains a purpose phrase such as 'my main point is' (lexicon)"
  organization:
    framing: "introduction cue in the first {opening:g} % and conclusion cue in the last {closing:g} % (lexicon)"
    transitions: "sentences with a transition cue in their first 3 words (lexicon)"
  hook: "question, statistic, story opening, quotation or contrast claim in the first {sentences:g} sentences (pattern rules)"
  support:
    items: "supporting items, one per sentence and type: statistic, example, analogy, quotation (pattern rules)"
    types: "distinct supporting-material types (statistic, example, analogy, quotation)"
  language:
    undefined_terms: "rare terms (word frequency below {zipf:g} on the Zipf scale) with no definition cue in the same or the next sentence"
    mean_sentence_words: "words per sentence, from the transcript's punctuation"
assessment:
  finding: "{dimension}: level {level} ({level_name}), based on {measured} of {total} measures ({measures}). {values}"
  not_measurable: "{dimension}: not measurable; none of its {total} measures could be computed ({reasons})"
  value: "{measure}: {value:g}"
  separator: "; "
  missing_camera: "no camera recording"
  missing_limit: "no time limit set"
  missing_other: "not computed"
  capped: "Reached level {reached}, limited to level {max_level} because only {measured} of {total} measures could be computed."
  level_unavailable_language: "Level {level} not available in Arabic yet ({what} not measured)."
  level_unavailable: "Level {level} not available ({what} not measured)."
  not_measured_what:
    followup:
      limitation_acknowledged: "limitation cues"
  failed: "could not be checked"
  text_failed: "text analysis failed"
  missing_followups: "no follow-up answer recorded"
  uncalibrated: "measured {value:g}, not scored until its thresholds are calibrated"
  information_only:
    central_message: "{dimension}: shown for information, not scored. No detection method reached the accuracy bar set in advance on hand-labelled practice talks; scoring will start once a language-model check is added."
  possible_main_point: "Possible main point (low confidence): “{quote}”"
  followup_not_measured_language: "not measured for {language} answers (ADR 0022)"
  followup_relevance_bank: "measured {values} on questions from the bank; not scored until relevance is recalibrated on generic questions"
  followup_no_answer: "Answer {answer}: no speech in the {window:g} s answer window."
  followup_low_relevance: "Answer {answer} shares little wording with the question (similarity {value:g}, below {limit:g})."
  measures:
    text:
      central_message:
        statements: "thesis sentences"
        in_opening: "main point stated in the opening (1 = yes)"
        in_closing: "main point restated in the closing (1 = yes)"
        key_phrase_recurrences: "body sentences with a key phrase"
        possible_main_point: "possible main point found (1 = yes; shown, not scored)"
      organization:
        framing_parts: "introduction and conclusion cues found"
        transitions: "sentences with a transition"
      hook:
        present: "opening hook (1 = yes)"
      support:
        items: "supporting items"
        types: "supporting-material types"
      language:
        undefined_terms: "rare terms without a definition"
        mean_sentence_words: "words per sentence"
    fillers:
      per_100_words: "fillers per 100 words (at least)"
    pauses:
      mid_sentence_per_min: "mid-sentence pauses per minute"
    vision:
      gaze:
        at_camera_share: "share of speaking time looking toward the camera"
    timing:
      overrun_s: "seconds over the time limit"
    followup:
      relevance_min: "lowest question-answer similarity over the follow-up answers"
      latency_max_s: "longest thinking time before a follow-up answer, after the reading allowance (s)"
      limitation_acknowledged: "limitation stated in a follow-up answer (1 = yes)"
      answered_all: "every follow-up answer window holds an answer (1 = yes)"
units:
  count: "count"
  "words/min": "words/min"
  "syllables/s": "syllables/s"
  per 100 words: "per 100 words"
  per 100 words (at least): "per 100 words (at least)"
  ratio: "ratio"
  dB: "dB"
  share of speech time: "share of speech time"
  semitones: "semitones"
  s: "s"
  similarity: "similarity"
  yes/no: "yes/no"
  sentences: "sentences"
  yes/no: "yes = 1, no = 0"
  items: "items"
  types: "types"
  terms: "terms"
  words/sentence: "words per sentence"
  per min: "per minute"
