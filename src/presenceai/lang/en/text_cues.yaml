# Cue lexicons for the English text detectors (P2-b, ADR 0018). PROVISIONAL: reviewed by the
# owner in the PR; adjusted on the C2 development part only (P2-e), so E4 on the C2 test part
# stays independent. These are lexicon matches, not an understanding of meaning or structure.
# Matching ignores case and punctuation ("e.g." matches "e g"), and whole words only.

thesis:            # a sentence that states the main point (central message)
  - today i will
  - today i'm going to
  - in this talk i will
  - in this presentation i will
  - my main point is
  - the main point is
  - my main message is
  - my message today is
  - i will show that
  - i want to show that
  - i will argue that
  - i argue that
  - the key idea is
  - the point i want to make is
  - my goal today is
  - the purpose of this talk is

introduction:      # a purpose or preview phrase in the opening
  - in this talk
  - in this presentation
  - today i will
  - today i'm going to
  - i will cover
  - i will talk about
  - i'm going to talk about
  - i will walk you through
  - we will look at
  - here is the plan
  - the plan for today
  - first i will
  - let me start

conclusion:        # a closing phrase in the closing
  - in conclusion
  - to conclude
  - to sum up
  - to summarize
  - in summary
  - to wrap up
  - to recap
  - so to recap
  - in short
  - the takeaway is
  - the key takeaway

transitions:       # counted only within the first 3 words of a sentence, once per sentence
  - first
  - firstly
  - second
  - secondly
  - third
  - thirdly
  - next
  - then
  - after that
  - finally
  - lastly
  - moving on
  - let's move on
  - another
  - in addition
  - furthermore
  - moreover
  - on the other hand
  - however
  - as a result
  - therefore
  - for this reason
  - similarly
  - in contrast
  - turning to

definition:        # a term counts as defined when one of these is in its sentence or the next
  - which means
  - that means
  - this means
  - that is
  - i e
  - in other words
  - stands for
  - refers to
  - is defined as
  - is called
  - we call

example:
  - for example
  - for instance
  - such as
  - e g
  - as an example
  - to illustrate
  - take the case of

analogy:
  - like a
  - like an
  - as if
  - as though
  - imagine
  - is similar to
  - similar to
  - think of it as
  - just like

quotation:         # quotation marks in the transcript also count
  - according to
  - once said
  - said that
  - in the words of
  - wrote that

story:             # story openings for the hook
  - when i was
  - last year
  - a few years ago
  - years ago
  - one day
  - i remember
  - let me tell you
  - the other day

contrast_lead:     # a contrast claim: a lead in one sentence and a turn in it or the next
  - most people think
  - many people believe
  - people often think
  - you might think
  - you may think
  - it is often said
  - we usually assume

contrast_turn:
  - but
  - however
  - actually
  - in fact
