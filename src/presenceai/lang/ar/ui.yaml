about:
  heading: "حول PresenceAI"
  body: |
    يقيس PresenceAI ما يمكن ملاحظته في عرض تدريبي: سرعة الكلام، والوقفات، وكلمات الحشو،
    وتغيّر شدة الصوت ودرجته، وطريقة تنظيم المحتوى. كل عبارة تُظهر دليلها (اقتباسًا أو وقتًا)
    ومستوى الثقة بها.

    يصف فقط ما قيس في التسجيل، ولا يصف الشخص أبدًا: لا يخمّن ما يشعر به أحد أو طبيعته، وليس
    أداة للتوظيف أو للتقييم الدراسي.

    **لماذا قد يظهر جزء من التقرير بأنه "غير قابل للقياس"**

    - **الكاميرا متوقفة:** يُقاس اتجاه النظر فقط عند تشغيل الكاميرا. تُستبعد المقاييس التي تحتاج
      إلى الكاميرا من العدد عند إيقافها، فلا يُعاقَب إيقاف الكاميرا أبدًا.
    - **لا حد زمني:** الملف المرفوع ليس له حد زمني للجلسة، فلا يمكن قياس تجاوز الوقت.
    - **العربية:** مقاييس المحتوى (الرسالة الرئيسية، والتنظيم، واللغة، والمواد الداعمة) والوقفات
      داخل الجملة تُقاس بالإنجليزية فقط حاليًا.
    - **علامات الترقيم:** عندما تقلّ علامات نهاية الجمل في التفريغ، لا يمكن تحديد مواضع الوقفات.
    - **تعذّر فحص:** إذا تعذّر فحص جزء من التقرير يظهر بأنه غير قابل للقياس، ويبقى باقي التقرير
      ظاهرًا.

    يذكر كل جزء "بناءً على N من M مقاييس". وعندما يُحسب نصف مقاييسه أو أقل، يُحدَّد مستواه بـ 3
    على الأكثر.

    **بياناتك:** التسجيلات ونص التقارير مشفّرة على هذا الحاسوب بمفتاحك (MEDIA_KEY). ومن دون
    هذا المفتاح لا يمكن قراءتها؛ وتبقى المستويات والمقاييس متاحة لمتابعة تقدّمك. يمكنك تصدير كل
    شيء أو حذفه من تبويب "بياناتي".
